# Dropwatch on Fly.io. ONE machine, ONE volume: subscriptions live in a
# sqlite file, so there must never be a second writer. Do not raise
# min_machines_running above 1 or `fly scale count` past 1.
app = "dropwatch"
primary_region = "ewr"

[build]
  dockerfile = "Dockerfile.dropwatch"

[env]
  # Fly's edge overwrites this header; X-Forwarded-For is client-prependable
  DROPWATCH_CLIENT_IP_HEADER = "Fly-Client-IP"
  DROPWATCH_NOTICE = "Early access: alerts are live for recreation.gov campgrounds."
  # DROPWATCH_PUBLIC_URL = "https://<app>.fly.dev"  (unsubscribe links in alerts)
  # Payment link / portal / price are public; set them here once Stripe
  # is configured. STRIPE_WEBHOOK_SECRET is NOT -- use `fly secrets set`.
  # DROPWATCH_PAYMENT_LINK = "https://buy.stripe.com/..."
  # DROPWATCH_PORTAL_URL = "https://billing.stripe.com/p/login/..."
  # DROPWATCH_PRICE_LABEL = "$5/mo"

[mounts]
  source = "dropwatch_data"
  destination = "/data"

[http_service]
  internal_port = 8787
  force_https = true
  # the dispatch runner lives in this process; a stopped machine sends nothing
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/api/status"
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
