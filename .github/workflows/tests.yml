name: tests
# CI gate: the whole suite (retired sentry + every Dropwatch component)
# must pass on every push/PR. stdlib unittest only -- no pip install.

on:
  push:
    branches: [main]
  pull_request: {}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # tests import sentry, which loads config at module import; the live
      # config.json is untracked (it holds tokens), so seed from the example
      - run: cp config.example.json config.json
      # retired sentry + repo-level checks (dependency direction)
      - run: python -m unittest discover -s tests -v
      # sources/ engine/ notify/ billing/ app/ deploy/ -- each has tests/
      - run: python -m unittest discover -s . -t . -v
