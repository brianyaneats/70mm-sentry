name: deadman
# Off-box dead-man's switch (design weak point W3 closure, no new accounts):
# the sentry publishes a heartbeat to a secret ntfy topic every ~5 min; this
# hourly job alerts via Telegram when the heartbeat goes stale. Every local
# layer (launchd, watchdog, startup check) dies with the Mac — this is the
# only alarm that survives the machine being asleep, off, or offline.
#
# Caveats (accepted): GitHub cron can lag minutes under load; scheduled
# workflows pause after 60 days without repo activity; ntfy.sh retains
# messages ~12h (the alert-dedup marker relies on that).

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch: {}

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check heartbeat, alert if stale
        env:
          HB_TOPIC: ${{ secrets.HEARTBEAT_TOPIC }}
          TG_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          STALE_AFTER_MIN: "90"
          REALERT_AFTER_MIN: "360"
        run: |
          set -euo pipefail
          now=$(date +%s)
          msgs=$(curl -fsS --max-time 30 "https://ntfy.sh/${HB_TOPIC}/json?poll=1&since=13h" || true)

          last_hb=$(printf '%s' "$msgs" | jq -rs '[.[] | select(.event=="message" and .title=="hb") | .time] | max // 0')
          last_alert=$(printf '%s' "$msgs" | jq -rs '[.[] | select(.event=="message" and .title=="deadman-alerted") | .time] | max // 0')

          hb_age_min=$(( (now - last_hb) / 60 ))
          if [ "$last_hb" -gt 0 ] && [ "$hb_age_min" -lt "$STALE_AFTER_MIN" ]; then
            echo "alive: last heartbeat ${hb_age_min}m ago"
            exit 0
          fi

          alert_age_min=$(( (now - last_alert) / 60 ))
          if [ "$last_alert" -gt 0 ] && [ "$alert_age_min" -lt "$REALERT_AFTER_MIN" ]; then
            echo "stale (hb ${hb_age_min}m) but already alerted ${alert_age_min}m ago; suppressing"
            exit 0
          fi

          if [ "$last_hb" -eq 0 ]; then
            desc="No heartbeat seen in the last 13h"
          else
            desc="Last heartbeat ${hb_age_min} min ago"
          fi
          text="🚨 OFF-BOX ALARM — 70mm Sentry heartbeat is stale.
          ${desc}. The Mac is likely asleep, off, or offline — you are NOT being watched for drops right now.
          Wake the Mac, then expect 'Sentry armed at startup'. (checked from GitHub Actions)"

          curl -fsS --max-time 30 "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            -d chat_id="${TG_CHAT}" --data-urlencode text="$text" > /dev/null
          echo "alerted via telegram"

          curl -fsS --max-time 30 -H "Content-Type: application/json" \
            -d "{\"topic\":\"${HB_TOPIC}\",\"title\":\"deadman-alerted\",\"message\":\"alert sent $(date -u +%FT%TZ)\",\"priority\":1}" \
            https://ntfy.sh > /dev/null

# NOTE: if the schedule ever stops firing (GitHub pauses cron after 60 days
# of repo inactivity, and fresh schedules may need a push to register),
# any commit to the default branch re-arms it. Manual check:
#   gh workflow run deadman.yml --repo brianyaneats/70mm-sentry
